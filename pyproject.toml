[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[project]
name="vigilant-traceability"
version="0.1.0"
requires-python=">=3.11,<3.14"
dynamic=["dependencies"]
[tool.setuptools.dynamic]
dependencies={file=["requirements.txt"]}
[tool.setuptools.packages.find]
include=["backend*","ingestion*","traceability*","retrieval*","rag*","knowledge_graph*","llm*","agents*","change_analysis*","consistency*","evaluation*","database*","scripts*"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
